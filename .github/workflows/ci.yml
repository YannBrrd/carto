name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Type-check renderer
        run: npx tsc --noEmit -p tsconfig.json

      - name: Type-check main process
        run: npx tsc --noEmit -p tsconfig.main.json

      # No CARTO_API_KEY: pull requests from forks and Dependabot get no secrets,
      # and the build only needs it for the basemap tiles.
      - name: Build
        run: npm run build
