name: Cleanup Old Releases

on:
  schedule:
    # Runs at 2:00 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Cleanup old releases
        uses: actions/github-script@v7
        with:
          script: |
            const keepCount = 3;

            // Fetch all releases
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            // Filter out draft and prerelease versions, sort by creation date
            const publishedReleases = releases
              .filter(r => !r.draft && !r.prerelease)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            console.log(`Found ${publishedReleases.length} published releases`);
            console.log(`Keeping the latest ${keepCount} releases`);

            // Releases to delete (everything after the first 3)
            const releasesToDelete = publishedReleases.slice(keepCount);

            if (releasesToDelete.length === 0) {
              console.log('No releases to delete');
              return;
            }

            console.log(`Deleting ${releasesToDelete.length} old releases:`);

            for (const release of releasesToDelete) {
              console.log(`- Deleting release: ${release.name || release.tag_name} (${release.tag_name})`);

              try {
                // Delete the release
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id,
                });

                // Delete the associated tag
                try {
                  await github.rest.git.deleteRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: `tags/${release.tag_name}`,
                  });
                  console.log(`  ✓ Deleted release and tag: ${release.tag_name}`);
                } catch (tagError) {
                  console.log(`  ✓ Deleted release: ${release.tag_name} (tag may not exist)`);
                }
              } catch (error) {
                console.error(`  ✗ Failed to delete release ${release.tag_name}:`, error.message);
              }
            }

            console.log('\nCleanup completed!');
            console.log(`Kept releases: ${publishedReleases.slice(0, keepCount).map(r => r.tag_name).join(', ')}`);
