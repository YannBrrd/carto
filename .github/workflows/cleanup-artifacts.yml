name: Cleanup Old Artifacts

on:
  schedule:
    # Runs at 2:00 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Cleanup old artifacts, releases, and caches
        uses: actions/github-script@v7
        with:
          script: |
            const keepReleaseCount = 3;

            console.log('='.repeat(60));
            console.log('CLEANUP WORKFLOW STARTED');
            console.log('='.repeat(60));
            console.log(`Keeping last ${keepReleaseCount} releases and their associated resources\n`);

            // ============================================
            // 1. DELETE OLD RELEASES (keep only last 3)
            // ============================================
            console.log('\n📦 STEP 1: Managing Releases');
            console.log('-'.repeat(60));

            const { data: allReleases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            // Filter published releases and sort by creation date
            const publishedReleases = allReleases
              .filter(r => !r.draft && !r.prerelease)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const releasesToKeep = publishedReleases.slice(0, keepReleaseCount);
            const releasesToDelete = publishedReleases.slice(keepReleaseCount);

            const releaseTags = releasesToKeep.map(r => r.tag_name);
            console.log(`Keeping releases: ${releaseTags.join(', ')}`);
            console.log(`Found ${releasesToDelete.length} old releases to delete\n`);

            let deletedReleasesCount = 0;
            for (const release of releasesToDelete) {
              try {
                console.log(`  Deleting release ${release.tag_name} (created ${release.created_at})...`);

                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id,
                });

                deletedReleasesCount++;
                console.log(`  ✓ Release ${release.tag_name} deleted (${release.assets.length} assets removed)`);
              } catch (error) {
                console.error(`  ✗ Failed to delete release ${release.tag_name}:`, error.message);
              }
            }

            console.log(`\nReleases cleanup: ${deletedReleasesCount} deleted, ${releasesToKeep.length} kept`);

            // ============================================
            // 2. DELETE OLD ARTIFACTS
            // ============================================
            console.log('\n📁 STEP 2: Managing Artifacts');
            console.log('-'.repeat(60));

            // Get all workflow runs
            const { data: workflowRuns } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            // Find workflow run IDs for the last N releases
            const releaseWorkflowRunIds = new Set();
            for (const run of workflowRuns.workflow_runs) {
              if (run.event === 'push') {
                const tagMatch = run.head_branch && releaseTags.includes(run.head_branch);
                const refMatch = releaseTags.some(tag => run.head_commit?.message?.includes(tag));

                if (tagMatch || refMatch) {
                  releaseWorkflowRunIds.add(run.id);
                }
              }
            }

            console.log(`Found ${releaseWorkflowRunIds.size} workflow runs for last ${keepReleaseCount} releases`);

            // Get all artifacts
            const { data: artifacts } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            console.log(`Found ${artifacts.artifacts.length} total artifacts`);

            // Separate artifacts to keep vs delete
            const artifactsToKeep = [];
            const artifactsToDelete = [];

            for (const artifact of artifacts.artifacts) {
              if (releaseWorkflowRunIds.has(artifact.workflow_run.id)) {
                artifactsToKeep.push(artifact);
              } else {
                artifactsToDelete.push(artifact);
              }
            }

            console.log(`Will delete ${artifactsToDelete.length} old artifacts\n`);

            let deletedArtifactsCount = 0;
            let deletedArtifactsSize = 0;

            for (const artifact of artifactsToDelete) {
              try {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });

                deletedArtifactsCount++;
                deletedArtifactsSize += artifact.size_in_bytes;

                const sizeMB = (artifact.size_in_bytes / 1024 / 1024).toFixed(2);
                console.log(`  ✓ ${artifact.name} (${sizeMB} MB) - created ${artifact.created_at}`);
              } catch (error) {
                console.error(`  ✗ Failed to delete artifact ${artifact.name}:`, error.message);
              }
            }

            const artifactsSizeMB = (deletedArtifactsSize / 1024 / 1024).toFixed(2);
            console.log(`\nArtifacts cleanup: ${deletedArtifactsCount} deleted (${artifactsSizeMB} MB freed), ${artifactsToKeep.length} kept`);

            // ============================================
            // 3. DELETE OLD CACHES
            // ============================================
            console.log('\n🗂️  STEP 3: Managing Caches');
            console.log('-'.repeat(60));

            try {
              // Get all caches
              const { data: caches } = await github.rest.actions.getActionsCacheList({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              });

              console.log(`Found ${caches.total_count} total caches`);

              if (caches.total_count === 0) {
                console.log('No caches to manage');
              } else {
                // Sort caches by last accessed time (most recent first)
                const sortedCaches = caches.actions_caches
                  .sort((a, b) => new Date(b.last_accessed_at) - new Date(a.last_accessed_at));

                // Keep caches from the last N releases
                const cachesToKeep = [];
                const cachesToDelete = [];

                for (const cache of sortedCaches) {
                  // Check if cache key matches any of the release tags
                  const isReleaseCache = releaseTags.some(tag => cache.key.includes(tag));

                  if (isReleaseCache) {
                    cachesToKeep.push(cache);
                  } else {
                    cachesToDelete.push(cache);
                  }
                }

                console.log(`Will delete ${cachesToDelete.length} old caches\n`);

                let deletedCachesCount = 0;
                let deletedCachesSize = 0;

                for (const cache of cachesToDelete) {
                  try {
                    await github.rest.actions.deleteActionsCacheById({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      cache_id: cache.id,
                    });

                    deletedCachesCount++;
                    deletedCachesSize += cache.size_in_bytes;

                    const sizeMB = (cache.size_in_bytes / 1024 / 1024).toFixed(2);
                    console.log(`  ✓ ${cache.key} (${sizeMB} MB) - last accessed ${cache.last_accessed_at}`);
                  } catch (error) {
                    console.error(`  ✗ Failed to delete cache ${cache.key}:`, error.message);
                  }
                }

                const cachesSizeMB = (deletedCachesSize / 1024 / 1024).toFixed(2);
                console.log(`\nCaches cleanup: ${deletedCachesCount} deleted (${cachesSizeMB} MB freed), ${cachesToKeep.length} kept`);
              }
            } catch (error) {
              console.error('Failed to manage caches:', error.message);
            }

            // ============================================
            // SUMMARY
            // ============================================
            console.log('\n' + '='.repeat(60));
            console.log('CLEANUP SUMMARY');
            console.log('='.repeat(60));
            console.log(`Releases:  ${deletedReleasesCount} deleted, ${releasesToKeep.length} kept`);
            console.log(`Artifacts: ${deletedArtifactsCount} deleted (${artifactsSizeMB} MB freed), ${artifactsToKeep.length} kept`);
            console.log(`Caches:    ${deletedCachesCount || 0} deleted (${cachesSizeMB || 0} MB freed)`);

            const totalSizeMB = ((deletedArtifactsSize + (deletedCachesSize || 0)) / 1024 / 1024).toFixed(2);
            console.log(`\nTotal storage freed: ${totalSizeMB} MB`);
            console.log('='.repeat(60));
