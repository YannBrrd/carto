name: Cleanup Old Artifacts

on:
  schedule:
    # Runs at 2:00 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cleanup old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const keepReleaseCount = 3;

            console.log('Fetching releases...');

            // Get all releases
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            // Filter published releases and sort by creation date
            const publishedReleases = releases
              .filter(r => !r.draft && !r.prerelease)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
              .slice(0, keepReleaseCount);

            const releaseTags = publishedReleases.map(r => r.tag_name);
            console.log(`Last ${keepReleaseCount} releases: ${releaseTags.join(', ')}`);

            // Get all workflow runs
            console.log('\nFetching workflow runs...');
            const { data: workflowRuns } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            // Find workflow run IDs for the last N releases
            const releaseWorkflowRunIds = new Set();
            for (const run of workflowRuns.workflow_runs) {
              // Check if the run was triggered by one of the release tags
              // Tags have refs like 'refs/tags/v1.7.10'
              if (run.event === 'push') {
                const tagMatch = run.head_branch && releaseTags.includes(run.head_branch);
                const refMatch = releaseTags.some(tag => run.head_commit?.message?.includes(tag));

                if (tagMatch || refMatch) {
                  releaseWorkflowRunIds.add(run.id);
                  console.log(`  - Found run #${run.run_number} for release`);
                }
              }
            }

            console.log(`Found ${releaseWorkflowRunIds.size} workflow runs for last ${keepReleaseCount} releases`);

            // Get all artifacts
            console.log('\nFetching artifacts...');
            const { data: artifacts } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            console.log(`Found ${artifacts.artifacts.length} total artifacts`);

            // Separate artifacts to keep vs delete
            const artifactsToKeep = [];
            const artifactsToDelete = [];

            for (const artifact of artifacts.artifacts) {
              if (releaseWorkflowRunIds.has(artifact.workflow_run.id)) {
                artifactsToKeep.push(artifact);
              } else {
                artifactsToDelete.push(artifact);
              }
            }

            console.log(`\nKeeping ${artifactsToKeep.length} artifacts from last ${keepReleaseCount} releases`);
            console.log(`Will delete ${artifactsToDelete.length} old artifacts\n`);

            if (artifactsToDelete.length === 0) {
              console.log('No artifacts to delete');
              return;
            }

            let deletedCount = 0;
            let deletedSize = 0;

            for (const artifact of artifactsToDelete) {
              try {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });

                deletedCount++;
                deletedSize += artifact.size_in_bytes;

                const sizeMB = (artifact.size_in_bytes / 1024 / 1024).toFixed(2);
                console.log(`✓ Deleted: ${artifact.name} (${sizeMB} MB) - created ${artifact.created_at}`);
              } catch (error) {
                console.error(`✗ Failed to delete artifact ${artifact.name}:`, error.message);
              }
            }

            const totalSizeMB = (deletedSize / 1024 / 1024).toFixed(2);
            console.log(`\nCleanup completed!`);
            console.log(`Deleted ${deletedCount} artifacts, freed ${totalSizeMB} MB of storage`);
